name: Garimpar a fila do dia

# Toda manhã o robô olha os mais vendidos do Meli e monta a fila do dia.
# Ele não publica nada: candidato só vira produto depois que alguém gera o
# link de afiliado, que é o passo que o Meli não expõe por API.
#
# Roda às 10h de Brasília, depois do robô de preços das 8h — os dois dividem
# o mesmo token de uso único e a fila de concorrência abaixo os serializa.

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# O refresh_token do Meli é de uso único. Se este e o robô de preços rodarem
# ao mesmo tempo, um invalida o token do outro — daí os dois na mesma fila.
concurrency:
  group: meli-token
  cancel-in-progress: false

jobs:
  garimpar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Garimpar os mais vendidos
        id: garimpo
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
        run: npm run garimpar

      - name: Guardar o refresh_token novo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ ! -f .meli-refresh ]; then
            echo "Sem refresh_token novo — a renovação nem chegou a acontecer."
            exit 0
          fi
          gh secret set ML_REFRESH_TOKEN --body "$(cat .meli-refresh)"
          rm .meli-refresh
          echo "Segredo ML_REFRESH_TOKEN atualizado."

      - name: Guardar a fila e avisar
        if: steps.garimpo.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          total=$(node -p "require('./data/candidatos.json').total")
          if [ "$total" = "0" ]; then
            echo "Nenhum produto novo hoje. A memória fez o trabalho dela."
            exit 0
          fi

          git config user.name  "robô de preços"
          git config user.email "contato@afdesousa.com.br"
          # git diff não enxerga arquivo novo, e na primeira rodada o
          # candidatos.json é exatamente isso. Compara depois do add.
          # A memória vai junto: sem ela commitada, o garimpo de amanhã
          # sugere de novo exatamente o que foi sugerido hoje.
          git add data/candidatos.json data/garimpo-memoria.json
          if ! git diff --cached --quiet; then
            git commit -m "Fila de $(date +%d/%m): $total candidato(s) garimpados"
            git push origin main
          fi

          node scripts/corpo-da-issue.mjs > corpo.md
          gh issue create --title "Fila de $(date +%d/%m): $total candidato(s) pra gerar link" --body-file corpo.md
